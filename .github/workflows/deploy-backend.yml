# CD: (1) Apply Prisma migrations on GitHub-hosted runner (reaches Neon reliably).
# (2) Build on self-hosted Pi, deploy via `pnpm deploy` (production bundle), prisma generate, restart.
#
# Trigger: CI workflow completed successfully after a push to `main`, or manual workflow_dispatch.
# Requires: GitHub-hosted runner secrets for migrate; Pi runner with labels: self-hosted, diecast360-pi
#
# Requires on Pi once: corepack enable && corepack prepare pnpm@10.33.4 --activate
# (matches root package.json "packageManager").
#
# GitHub Environment "production" secrets (for migrate job):
#   PRODUCTION_DATABASE_URL — Neon pooled URL (same meaning as backend DATABASE_URL)
#   PRODUCTION_DIRECT_URL   — Neon direct URL (for prisma migrate)
#
# Optional secret: DEPLOY_REMOTE_PATH (default /opt/diecast360-backend)

name: Deploy backend (Pi)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrate:
        description: "Skip prisma migrate (use if Neon/GitHub already migrated)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  migrate:
    name: Prisma migrate (production)
    runs-on: ubuntu-latest
    environment: production
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate & migrate deploy
        if: ${{ github.event_name != 'workflow_dispatch' || !fromJSON(github.event.inputs.skip_migrate || 'false') }}
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
        run: |
          pnpm --filter ./backend exec prisma generate
          pnpm --filter ./backend exec prisma migrate deploy

      - name: Skip migrate (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.skip_migrate || 'false') }}
        run: echo "::notice::Skipped prisma migrate deploy — manual skip."

  deploy:
    name: Build & deploy on Pi
    needs: migrate
    runs-on: [self-hosted, diecast360-pi]
    environment: production
    env:
      DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Enable corepack / pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --version

      - name: Setup Node.js (cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install & build
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NODE_ENV: development
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./backend run build

      - name: Verify build output
        run: |
          test -d backend/dist
          test -n "$(find backend/dist -type f -print -quit)" \
            || (echo "::error::backend/dist empty — aborting deploy"; exit 1)

      - name: Produce production bundle
        id: bundle
        env:
          NODE_ENV: development
        run: |
          DEPLOY_STAGE="${RUNNER_TEMP}/deploy-stage"
          rm -rf "$DEPLOY_STAGE"
          pnpm --filter ./backend deploy --prod --legacy "$DEPLOY_STAGE"
          echo "path=${DEPLOY_STAGE}" >> "$GITHUB_OUTPUT"

      - name: Sync bundle to runtime directory
        run: |
          set -euo pipefail
          REDIR="${DEPLOY_REMOTE_PATH:-/opt/diecast360-backend}"
          mkdir -p "$REDIR"
          rsync -a --delete --exclude='.env' "${{ steps.bundle.outputs.path }}/" "${REDIR}/"

      - name: Prisma generate & restart API
        run: |
          set -euo pipefail
          REDIR="${DEPLOY_REMOTE_PATH:-/opt/diecast360-backend}"
          cd "$REDIR"
          set -a
          [ -f .env ] && . ./.env
          set +a
          PORT="${PORT:-3000}"
          npx prisma generate
          sudo systemctl restart diecast360-api
          systemctl is-active --quiet diecast360-api
          HEALTH_RETRIES="${HEALTH_RETRIES:-30}"
          HEALTH_INTERVAL_SEC="${HEALTH_INTERVAL_SEC:-2}"
          for i in $(seq 1 "$HEALTH_RETRIES"); do
            if curl -sfS "http://127.0.0.1:${PORT}/api/v1/health" >/dev/null; then
              break
            fi
            if [ "$i" -eq "$HEALTH_RETRIES" ]; then
              echo "::error::Health check failed after ${HEALTH_RETRIES} attempts" >&2
              sudo systemctl --no-pager -l status diecast360-api || true
              journalctl -u diecast360-api -n 80 --no-pager || true
              exit 1
            fi
            sleep "${HEALTH_INTERVAL_SEC}"
          done
