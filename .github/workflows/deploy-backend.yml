# Reusable CD — only invoked from CI (push main) or deploy-backend-manual.yml.
# Do not add workflow_dispatch here (manual runs stay off commit checks).
#
# (1) Prisma migrate on GitHub-hosted (Neon). (2) Build bundle on Pi, rsync, restart.
#
# Requires: Pi runner labels self-hosted, diecast360-pi; corepack pnpm@10.33.4 on Pi.
# Secrets (environment production): PRODUCTION_DATABASE_URL, PRODUCTION_DIRECT_URL;
# optional DEPLOY_REMOTE_PATH.

name: Deploy backend (Pi)

on:
  workflow_call:
    inputs:
      skip_migrate:
        description: Skip prisma migrate deploy
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  migrate:
    name: Prisma migrate (production)
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate & migrate deploy
        if: ${{ !inputs.skip_migrate }}
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
        run: |
          pnpm --filter ./backend exec prisma generate
          pnpm --filter ./backend exec prisma migrate deploy

      - name: Skip migrate
        if: ${{ inputs.skip_migrate }}
        run: echo "::notice::Skipped prisma migrate deploy."

  deploy:
    name: Build & deploy on Pi
    needs: migrate
    runs-on: [self-hosted, diecast360-pi]
    environment: production
    env:
      DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable corepack / pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --version

      - name: Setup Node.js (cache)
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install & build
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NODE_ENV: development
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./backend run build

      - name: Verify build output
        run: |
          test -d backend/dist
          test -n "$(find backend/dist -type f -print -quit)" \
            || (echo "::error::backend/dist empty — aborting deploy"; exit 1)

      - name: Produce production bundle
        id: bundle
        env:
          NODE_ENV: development
        run: |
          DEPLOY_STAGE="${RUNNER_TEMP}/deploy-stage"
          rm -rf "$DEPLOY_STAGE"
          pnpm --filter ./backend deploy --prod --legacy "$DEPLOY_STAGE"
          echo "path=${DEPLOY_STAGE}" >> "$GITHUB_OUTPUT"

      - name: Sync bundle to runtime directory
        run: |
          set -euo pipefail
          REDIR="${DEPLOY_REMOTE_PATH:-/opt/diecast360-backend}"
          mkdir -p "$REDIR"
          # Excludes protect operator state in REDIR (not part of the bundle).
          # - .env: per-host secrets
          # - /uploads: legacy UPLOAD_DIR; prefer UPLOAD_DIR outside REDIR (see backend/.env.production.example).
          rsync -a --delete \
            --exclude='/.env' \
            --exclude='/uploads' \
            --exclude='/uploads/' \
            "${{ steps.bundle.outputs.path }}/" "${REDIR}/"

      - name: Prisma generate & restart API
        run: |
          set -euo pipefail
          REDIR="${DEPLOY_REMOTE_PATH:-/opt/diecast360-backend}"
          cd "$REDIR"
          set -a
          [ -f .env ] && . ./.env
          set +a
          PORT="${PORT:-3000}"
          npx prisma generate
          sudo systemctl restart diecast360-api
          systemctl is-active --quiet diecast360-api
          HEALTH_RETRIES="${HEALTH_RETRIES:-30}"
          HEALTH_INTERVAL_SEC="${HEALTH_INTERVAL_SEC:-2}"
          for i in $(seq 1 "$HEALTH_RETRIES"); do
            if curl -sfS "http://127.0.0.1:${PORT}/api/v1/health" >/dev/null; then
              echo "::notice::API healthy on port ${PORT}"
              break
            fi
            if [ "$i" -eq "$HEALTH_RETRIES" ]; then
              echo "::error::Health check failed after ${HEALTH_RETRIES} attempts" >&2
              sudo systemctl --no-pager -l status diecast360-api || true
              journalctl -u diecast360-api -n 80 --no-pager || true
              exit 1
            fi
            sleep "${HEALTH_INTERVAL_SEC}"
          done
