# CD (fail-fast): check-changes → build gate (GitHub) → migrate (Neon) → deploy (Pi) → CD Success.
# Build runs before migrate so a broken compile does not touch production schema.
#
# Trigger: CI workflow completed successfully after a push to `main`, or manual workflow_dispatch.
#
# Path filter: `check-changes` uses artifact `push-changed-files-<sha>` from CI
# (full push before..after diff on main). Fallback: HEAD^..HEAD. Only runs
# migrate/deploy when `backend/**`, `pnpm-lock.yaml`, or this workflow changed.
# `workflow_dispatch` always deploys. See docs/CICD.md.
#
# Requires: GitHub-hosted runner secrets for migrate; Pi runner with labels: self-hosted, diecast360-pi
#
# Requires on Pi once: corepack enable && corepack prepare pnpm@10.33.4 --activate
# (matches root package.json "packageManager").
#
# GitHub Environment "production" secrets (for migrate job):
#   PRODUCTION_DATABASE_URL — Neon pooled URL (same meaning as backend DATABASE_URL)
#   PRODUCTION_DIRECT_URL   — Neon direct URL (for prisma migrate)
#
# Optional secret: DEPLOY_REMOTE_PATH (default /opt/diecast360-backend)

name: Deploy backend (Pi)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrate:
        description: "Skip prisma migrate (use if Neon/GitHub already migrated)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  check-changes:
    name: Check if backend changed
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Download push changed-files from CI
        if: github.event_name == 'workflow_run'
        id: push_artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: push-changed-files-${{ github.event.workflow_run.head_sha }}
          path: /tmp/push-changed-files

      - name: Detect backend-relevant changes
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice::Manual dispatch — skipping path filter, deploying."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f /tmp/push-changed-files/changed-files.txt ]; then
            changed=$(cat /tmp/push-changed-files/changed-files.txt)
            echo "Changed files (CI push artifact):"
          elif ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "::notice::No parent commit available; defaulting to deploy."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            changed=$(git diff --name-only HEAD^ HEAD || true)
            echo "Changed files (fallback HEAD^..HEAD):"
          fi
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" \
            | grep -qE '^(backend/|pnpm-lock\.yaml$|\.github/workflows/deploy-backend\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No backend-relevant changes — skipping build, migrate & deploy."
          fi

  build:
    name: Build backend (gate)
    needs: check-changes
    if: needs.check-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install & build
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NODE_ENV: development
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./backend run build

      - name: Verify build output
        run: |
          test -d backend/dist
          test -n "$(find backend/dist -type f -print -quit)" \
            || (echo "::error::backend/dist empty — aborting CD"; exit 1)

  migrate:
    name: Prisma migrate (production)
    needs: [check-changes, build]
    if: needs.check-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate & migrate deploy
        if: ${{ github.event_name != 'workflow_dispatch' || !fromJSON(github.event.inputs.skip_migrate || 'false') }}
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
        run: |
          pnpm --filter ./backend exec prisma generate
          pnpm --filter ./backend exec prisma migrate deploy

      - name: Skip migrate (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.skip_migrate || 'false') }}
        run: echo "::notice::Skipped prisma migrate deploy — manual skip."

  deploy:
    name: Build & deploy on Pi
    needs: [check-changes, migrate]
    if: needs.check-changes.outputs.backend == 'true'
    runs-on: [self-hosted, diecast360-pi]
    environment: production
    env:
      DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Enable corepack / pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --version

      - name: Setup Node.js (cache)
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install & build
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NODE_ENV: development
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./backend run build

      - name: Verify build output
        run: |
          test -d backend/dist
          test -n "$(find backend/dist -type f -print -quit)" \
            || (echo "::error::backend/dist empty — aborting deploy"; exit 1)

      - name: Produce production bundle
        id: bundle
        env:
          NODE_ENV: development
        run: |
          DEPLOY_STAGE="${RUNNER_TEMP}/deploy-stage"
          rm -rf "$DEPLOY_STAGE"
          pnpm --filter ./backend deploy --prod --legacy "$DEPLOY_STAGE"
          echo "path=${DEPLOY_STAGE}" >> "$GITHUB_OUTPUT"

      - name: Sync bundle to runtime directory
        run: |
          set -euo pipefail
          REDIR="${DEPLOY_REMOTE_PATH:-/opt/diecast360-backend}"
          mkdir -p "$REDIR"
          # Excludes protect operator state that lives in REDIR but is NOT part of
          # the deploy bundle. Without these, `--delete` wipes user data each deploy.
          # - .env: secrets configured per-host
          # - /uploads: legacy default UPLOAD_DIR (./uploads -> $REDIR/uploads). New
          #   installs should set UPLOAD_DIR outside REDIR (see backend/.env.production.example).
          rsync -a --delete \
            --exclude='/.env' \
            --exclude='/uploads' \
            --exclude='/uploads/' \
            "${{ steps.bundle.outputs.path }}/" "${REDIR}/"

      - name: Prisma generate & restart API
        run: |
          set -euo pipefail
          REDIR="${DEPLOY_REMOTE_PATH:-/opt/diecast360-backend}"
          cd "$REDIR"
          set -a
          [ -f .env ] && . ./.env
          set +a
          PORT="${PORT:-3000}"
          npx prisma generate
          sudo systemctl restart diecast360-api
          systemctl is-active --quiet diecast360-api
          HEALTH_RETRIES="${HEALTH_RETRIES:-30}"
          HEALTH_INTERVAL_SEC="${HEALTH_INTERVAL_SEC:-2}"
          for i in $(seq 1 "$HEALTH_RETRIES"); do
            if curl -sfS "http://127.0.0.1:${PORT}/api/v1/health" > /tmp/prod-health.json; then
              bash scripts/ci/assert-health-json.sh /tmp/prod-health.json
              echo "Production API healthy after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq "$HEALTH_RETRIES" ]; then
              echo "::error::Health check failed after ${HEALTH_RETRIES} attempts" >&2
              sudo systemctl --no-pager -l status diecast360-api || true
              journalctl -u diecast360-api -n 80 --no-pager || true
              exit 1
            fi
            sleep "${HEALTH_INTERVAL_SEC}"
          done

      - name: Job summary
        if: success()
        run: |
          {
            echo "## Production backend deployed"
            echo "| | |"
            echo "|---|---|"
            echo "| **Commit** | \`${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}\` |"
            echo "| **Health** | \`GET /api/v1/health\` on Pi (DB probe) |"
            echo "| **Frontend** | Vercel (separate check on same commit) |"
          } >> "$GITHUB_STEP_SUMMARY"

  cd-success:
    name: CD Success
    needs: [check-changes, build, migrate, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report CD outcome
        env:
          BACKEND: ${{ needs.check-changes.outputs.backend }}
          BUILD: ${{ needs.build.result }}
          MIGRATE: ${{ needs.migrate.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          if [ "$BACKEND" != "true" ]; then
            echo "::notice::CD skipped — no backend-relevant changes in this push."
            echo "## CD skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`backend/**\`, \`pnpm-lock.yaml\`, or deploy workflow changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for job in build migrate deploy; do
            r=""
            case "$job" in
              build) r="$BUILD" ;;
              migrate) r="$MIGRATE" ;;
              deploy) r="$DEPLOY" ;;
            esac
            if [ "$r" != "success" ]; then
              echo "::error::CD job ${job} result: ${r}"
              exit 1
            fi
          done
          echo "Production CD completed (build gate, migrate, Pi deploy)."
          echo "## CD Success" >> "$GITHUB_STEP_SUMMARY"
          echo "Build gate, Neon migrate, and Pi deploy finished." >> "$GITHUB_STEP_SUMMARY"
