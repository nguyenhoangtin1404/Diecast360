# Diecast360: Neon GitHub integration sample + Prisma on preview branch.
# Variables: NEON_PROJECT_ID — Secrets: NEON_API_KEY
# v6 action outputs: db_url, db_url_pooled (not db_url_with_pooler).

name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
      neon_preview_branch: ${{ steps.neon_preview_branch.outputs.name }}
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v9

      # Git branch names may contain "/" (e.g. refactor/frontend-admin). Neon rejects some
      # nested paths on create (422). Use a flat slug shared by create + delete jobs.
      - name: Build Neon preview branch name
        id: neon_preview_branch
        run: |
          git_branch="${{ steps.branch_name.outputs.current_branch }}"
          sanitized="${git_branch//\//-}"
          sanitized="$(echo "$sanitized" | sed 's/[^a-zA-Z0-9._-]/-/g')"
          echo "name=preview/pr-${{ github.event.number }}-${sanitized}" >> "$GITHUB_OUTPUT"

  create_neon_branch:
    name: Create Neon Branch
    # Do not re-expose connection strings as job outputs (they contain credentials).
    needs: setup
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event_name == 'pull_request' && (
        github.event.action == 'synchronize'
        || github.event.action == 'opened'
        || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Delete Neon Branch if exists
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ needs.setup.outputs.neon_preview_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ needs.setup.outputs.neon_preview_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}
          prisma: true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Pooled for app-style URL; direct for Prisma migrate (see backend prisma schema).
      - name: Prisma migrate (preview DB)
        working-directory: .
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.create_neon_branch.outputs.db_url }}
        run: |
          pnpm install --frozen-lockfile --filter ./backend...
          pnpm --filter ./backend exec prisma generate
          # Neon preview branches re-use the same DB across CI runs on the same PR.
          # If a prior run partially applied this migration (e.g. enum created but ALTER failed),
          # Prisma marks it as "failed" and blocks deploy. The resolve --rolled-back resets that
          # state so the idempotent migration can re-run cleanly. The || true is safe because
          # the command fails harmlessly when the migration is not in a failed state.
          # Production (Pi) uses deploy-backend.yml which does NOT include this step.
          pnpm --filter ./backend exec prisma migrate resolve --rolled-back 20260529000000_security_login_hardening || true
          pnpm --filter ./backend exec prisma migrate deploy

  # Optional: neondatabase/schema-diff-action with pull-requests: write — see Neon docs.

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ needs.setup.outputs.neon_preview_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
