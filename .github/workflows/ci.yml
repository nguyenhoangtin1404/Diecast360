name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Backend Job
  # ============================================
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔧 Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/diecast360'
          DIRECT_URL: 'postgresql://postgres:postgres@localhost:5432/diecast360'

      - name: 🔍 Lint
        run: npm run lint

      - name: 🏗️ Build
        run: npm run build

      - name: 🧪 Run backend unit tests
        run: npx jest --runInBand
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/diecast360'
          DIRECT_URL: 'postgresql://postgres:postgres@localhost:5432/diecast360'

      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: backend-build
          path: backend/dist
          retention-days: 7

  # ============================================
  # Backend smoke (boot + DB + /api/v1/health)
  # ============================================
  health-check:
    name: Backend Health Check
    needs: backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: diecast360_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diecast360_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/diecast360_test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diecast360_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/diecast360_test

      - name: Ensure uploads directory
        run: mkdir -p uploads

      - name: Start API in background
        run: node dist/main.js &
        env:
          NODE_ENV: development
          PORT: '3000'
          HOST: '127.0.0.1'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diecast360_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/diecast360_test
          JWT_SECRET: ci-jwt-secret-32-chars-minimum-required
          COOKIE_SECRET: ci-cookie-secret-32-chars-min-length
          UPLOAD_DIR: ./uploads

      - name: Wait for API ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3000/api/v1/health; then
              exit 0
            fi
            if [ "$i" -eq 20 ]; then
              echo "API did not become healthy in time"
              exit 1
            fi
            sleep 2
          done

      - name: Health check response
        run: curl -sf http://127.0.0.1:3000/api/v1/health | jq -e '.ok == true'

  # ============================================
  # Frontend Job
  # ============================================
  frontend:
    # Branch protection: require this job (includes lint, typecheck, unit tests, Playwright E2E).
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🔬 Type Check
        run: npx tsc --noEmit

      - name: 🏗️ Build
        run: npm run build

      - name: 🧪 Run unit tests
        run: npm run test:unit

      - name: ♻️ Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Always run `playwright install` so browser revision matches @playwright/test after npm ci.
      # Cache hit alone can leave a stale ~/.cache/ms-playwright and break launch (missing headless shell).
      - name: 📥 Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: 🧭 Run Playwright E2E tests
        run: npm run test:e2e

      - name: 📸 Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # ============================================
  # Security Audit
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔒 Audit Backend Dependencies
        working-directory: ./backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 🔒 Audit Frontend Dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  # ============================================
  # Final Status Check (for branch protection)
  # ============================================
  ci-success:
    name: CI Success
    needs: [backend, frontend, health-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: ✅ Check all jobs passed
        run: |
          if [[ "${{ needs.backend.result }}" != "success" ]] || [[ "${{ needs.frontend.result }}" != "success" ]] || [[ "${{ needs.health-check.result }}" != "success" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
